[package]
name = "super-prompt-creator"
version = "1.0.0"
description = "Turn rough ideas into super prompts with your Google Gemini account"
edition = "2021"
publish = false

[[bin]]
name = "SuperPromptCreator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# custom-protocol: always serve the embedded ../ui files (there is no dev server).
tauri = { version = "2.10", features = ["custom-protocol"] }
tauri-plugin-single-instance = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "system-proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
arboard = { version = "3", default-features = false }
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
